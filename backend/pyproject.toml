[project]
name = "howlix-backend"
version = "0.5.0"
description = "Howlix API and durable media analysis and rendering worker"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: tests that require explicit real cloud credentials and opt-in",
]

