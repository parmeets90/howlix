name: Howlix on-demand worker

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Persisted Howlix processing job UUID
        required: true
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: howlix-private-beta-worker
  cancel-in-progress: false

jobs:
  process-job:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HOWLIX_ENVIRONMENT: production
      HOWLIX_DATABASE_SCHEMA: howlix
      R2_REGION: auto
      TRANSCRIPTION_PROVIDER: groq
      MOMENT_ANALYSIS_PROVIDER: groq
      GITHUB_ACTIONS_DISPATCH_ENABLED: "true"
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_WORKER_WORKFLOW: howlix-worker.yml
      GITHUB_WORKER_REF: main
      GITHUB_ACTIONS_MAX_ACTIVE_JOBS: "1"
      PROCESSING_TEMP_DIR: ${{ runner.temp }}/howlix
      FFMPEG_PATH: ffmpeg
      FFPROBE_PATH: ffprobe
      RENDER_PREFER_NVENC: "false"
      RENDER_CPU_THREADS: "2"
      CAPTION_FONTS_DIR: /usr/share/fonts/truetype/noto
      CAPTION_LATIN_FONT: Noto Sans
      CAPTION_COMPLEX_FONT: Noto Sans Devanagari

    steps:
      - name: Check out trusted main branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-face-detection.txt

      - name: Install FFmpeg and multilingual fonts
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg fonts-noto-core fonts-noto-extra

      - name: Install worker dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-face-detection.txt

      - name: Validate job ID
        env:
          HOWLIX_JOB_ID: ${{ inputs.job_id }}
        run: python -c "import os, uuid; uuid.UUID(os.environ['HOWLIX_JOB_ID'])"

      - name: Process exactly one persisted job
        working-directory: backend
        env:
          HOWLIX_JOB_ID: ${{ inputs.job_id }}
          HOWLIX_DATABASE_URL: ${{ secrets.HOWLIX_DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_ACTIONS_TOKEN: ${{ github.token }}
        run: python -m app.worker --job-id "$HOWLIX_JOB_ID"

      - name: Clean ephemeral processing files
        if: always()
        run: rm -rf -- "${RUNNER_TEMP}/howlix"
